[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "translator"
version = "0.1.0"
description = "Korean to English PPTX Translator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=0.6.23",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "tqdm>=4.66.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "langchain-core>=0.2.0"
]

[project.scripts]
translator = "translator.main:main"

[tool.setuptools]
packages = ["translator"]
